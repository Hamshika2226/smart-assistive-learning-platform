<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – EduLearn</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.login-wrap { max-width: 380px; margin: 4rem auto; }
.login-wrap h1 { text-align: center; color: #1a237e; margin-bottom: 1.5rem; }
</style>
</head>
<body>
<nav>
  <span class="brand">📚 EduLearn</span>
  <a href="/">Home</a>
</nav>
<div class="page login-wrap">
  <h1>Login</h1>
  {% if error %}<div class="alert alert-blue">{{ error }}</div>{% endif %}
  <div class="card">
    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" required placeholder="your@email.com">
      <label>Password</label>
      <input type="password" name="password" required placeholder="password">
      <button class="btn btn-blue mt" style="width:100%" type="submit">Login</button>
    </form>
    <hr style="margin:1rem 0;border:none;border-top:1px solid #eee">
    <p class="muted" style="text-align:center">Don't have an account? <a href="/register" style="color:#1a237e">Register</a></p>
  </div>
</div>
</body>
</html>
